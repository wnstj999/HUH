name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      demo:
        description: 'Build browser-only demo without backend or API keys'
        type: boolean
        default: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.sha }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Validate backend URL
        if: inputs.demo != true
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: node -e "for (const name of ['VITE_API_BASE_URL','VITE_SUPABASE_URL','VITE_SUPABASE_ANON_KEY']) if(!process.env[name]) throw new Error('Set '+name+' in GitHub Actions variables.'); if(new URL(process.env.VITE_API_BASE_URL).protocol !== 'https:') throw new Error('VITE_API_BASE_URL must use HTTPS.')"
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
        env:
          VITE_LOCAL_MODE: ${{ inputs.demo == true && 'true' || 'false' }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
